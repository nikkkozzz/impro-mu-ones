<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      window.addEventListener(
        'error',
        function (event) {
          var src = (event && (event.filename || (event.error && event.error.stack))) || '';
          if (
            typeof src === 'string' &&
            (src.indexOf('chrome-extension://') !== -1 || src.indexOf('moz-extension://') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        },
        true
      );
    </script>
    <title>Improvisación para Muñones — Curso Interactivo de Guitarra</title>
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Muñones" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta
      name="description"
      content="Curso interactivo paso a paso de improvisación en guitarra con diagramas SVG, tablaturas con reproducción Web Audio, metrónomo integrado y seguimiento de progreso."
    />
    <meta property="og:title" content="Improvisación para Muñones — Curso Interactivo de Guitarra" />
    <meta
      property="og:description"
      content="Domina los arpegios, escalas, modos, tensiones y ritmo en guitarra con lecciones guiadas paso a paso y herramientas de práctica integradas."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link

      rel="stylesheet"
    />
  </head>
